name: Deploy restauracja

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/wdrozenie-docker/restauracja/Restauracja_develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH and server tools
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
            set -e
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            command -v rsync
            command -v docker
            docker compose version
            test -f .env
          EOF

      - name: Sync files to server
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          rsync -az --delete \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/deploy_key" \
            --exclude=".github/" \
            --exclude=".git/" \
            --exclude=".env" \
            --exclude="vendor/" \
            --exclude="node_modules/" \
            --exclude="public/build/" \
            --exclude="storage/" \
            ./ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$DEPLOY_PATH/"

      - name: Verify synced deploy files
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
            set -e
            cd "$DEPLOY_PATH"
            test -f Dockerfile
            test -f docker-compose.yml
          EOF

      - name: Run deploy commands
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' SERVER_USER='${{ secrets.SERVER_USER }}' bash -s" <<'EOF'
            set -e
            cd "$DEPLOY_PATH"

            docker run --rm -v "$PWD":/app -w /app composer:2 composer install --no-dev --optimize-autoloader
            docker run --rm -v "$PWD":/app -w /app node:24 npm ci
            docker run --rm -v "$PWD":/app -w /app node:24 npm run build

            mkdir -p \
              storage/app/private \
              storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/testing \
              storage/framework/views \
              storage/logs \
              bootstrap/cache \
              public/build
            chown -R "${{ secrets.SERVER_USER }}":wdrozenie-docker vendor node_modules public/build storage bootstrap/cache

            docker compose up -d --build --force-recreate
            docker exec restauracja-app php artisan migrate --force
            docker exec restauracja-app php artisan optimize:clear

            curl -I http://localhost:8001
          EOF
