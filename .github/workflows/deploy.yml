name: Deploy restauracja

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/wdrozenie-docker/restauracja/Restauracja_develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH and server tools
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
            set -e
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            command -v rsync
            command -v docker
            docker compose version
            test -f .env
          EOF

      - name: Sync files to server
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          rsync -az --delete \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/deploy_key" \
            --exclude=".github/" \
            --exclude=".git/" \
            --exclude=".env" \
            --exclude="vendor/" \
            --exclude="node_modules/" \
            --exclude="public/build/" \
            --exclude="storage/" \
            ./ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$DEPLOY_PATH/"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<EOF
            set -e
            cd "\$DEPLOY_PATH"
            {
              echo "repository=${{ github.repository }}"
              echo "ref=${{ github.ref_name }}"
              echo "sha=${{ github.sha }}"
              echo "run_id=${{ github.run_id }}"
              echo "deployed_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            } > .deploy-info
          EOF

      - name: Verify synced deploy files
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
            set -e
            cd "$DEPLOY_PATH"
            test -f Dockerfile
            test -f docker-compose.yml
          EOF

      - name: Run deploy commands
        run: |
          set -euo pipefail

          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"

          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "DEPLOY_PATH='$DEPLOY_PATH' SERVER_USER='${{ secrets.SERVER_USER }}' bash -s" <<'EOF'
            set -e
            cd "$DEPLOY_PATH"

            mkdir -p \
              storage/app/private \
              storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/testing \
              storage/framework/views \
              storage/logs \
              bootstrap/cache \
              public/build

            USER_ID="$(id -u)"
            GROUP_ID="$(id -g)"

            docker run --rm --user "$USER_ID:$GROUP_ID" \
              -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
              -v "$PWD":/app -w /app \
              composer:2 composer install --no-dev --optimize-autoloader

            docker run --rm --user "$USER_ID:$GROUP_ID" \
              -e npm_config_cache=/tmp/.npm \
              -v "$PWD":/app -w /app \
              node:24 npm ci

            docker run --rm --user "$USER_ID:$GROUP_ID" \
              -e npm_config_cache=/tmp/.npm \
              -v "$PWD":/app -w /app \
              node:24 npm run build

            chmod -R ug+rwX \
              vendor \
              node_modules \
              public/build \
              bootstrap/cache \
              storage/app \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/testing \
              storage/logs

            chmod ug+rwX storage storage/framework storage/framework/views 2>/dev/null || true

            docker compose up -d --build --force-recreate --remove-orphans
            docker exec restauracja-app php artisan migrate --force
            docker exec restauracja-app php artisan optimize:clear

            curl -I http://localhost:8001
          EOF
