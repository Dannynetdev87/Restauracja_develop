name: Deploy restauracja

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=".git/" \
            --exclude=".env" \
            --exclude="vendor/" \
            --exclude="node_modules/" \
            --exclude="public/build/" \
            --exclude="storage/logs/" \
            --exclude="storage/framework/cache/" \
            --exclude="storage/framework/sessions/" \
            --exclude="storage/framework/views/" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/wdrozenie-docker/restauracja/Restauracja_develop/

      - name: Run deploy commands
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /opt/wdrozenie-docker/restauracja/Restauracja_develop

            docker run --rm -v "$PWD":/app -w /app composer:2 composer install --no-dev --optimize-autoloader
            docker run --rm -v "$PWD":/app -w /app node:24 npm ci
            docker run --rm -v "$PWD":/app -w /app node:24 npm run build

            chown -R wollekd:wdrozenie-docker vendor node_modules public/build storage bootstrap/cache

            docker compose up -d --build --force-recreate
            docker exec restauracja-app php artisan migrate --force
            docker exec restauracja-app php artisan optimize:clear

            curl -I http://localhost:8001
          EOF
